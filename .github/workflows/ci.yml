name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  test-and-fuzz:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install QBE
        run: |
          sudo apt-get update
          sudo apt-get install -y qbe

      - name: Build and run test suite
        run: make test

      - name: Build and run fuzzer
        run: make fuzz FUZZ_ITERS=50000
