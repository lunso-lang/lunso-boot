name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install QBE
        run: |
          sudo apt-get update
          sudo apt-get install -y qbe

      - name: Build and test
        run: make test

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "lunso-boot ${GITHUB_REF_NAME#v}" \
            --generate-notes
